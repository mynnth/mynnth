name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Change color to purple
        run: |
          sed -i 's/#39d353/#a855f7/g' profile-3d-contrib/profile-green-animate.svg
          sed -i 's/#26a641/#9333ea/g' profile-3d-contrib/profile-green-animate.svg
          sed -i 's/#006d32/#7e22ce/g' profile-3d-contrib/profile-green-animate.svg
          sed -i 's/#0e4429/#581c87/g' profile-3d-contrib/profile-green-animate.svg

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
